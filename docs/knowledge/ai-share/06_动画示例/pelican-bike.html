<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f4e9">
  <title>鹈鹕的海边骑行 · Pelican, on a bicycle</title>
  <style>
    :root { color-scheme: light; --paper:#f7f4e9; --ink:#293f3e; --muted:#6a7770; --orange:#cf5639; --line:#d9ddcf; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    button,input { font:inherit; }
    button { cursor:pointer; -webkit-tap-highlight-color:transparent; }
    button:focus-visible,input:focus-visible { outline:3px solid #247f83; outline-offset:5px; }
    .page { width:min(1280px,100%); margin:auto; padding:30px 58px 25px; }
    .masthead { display:flex; justify-content:space-between; align-items:center; gap:16px; padding-bottom:23px; border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:12px; font-size:13px; font-weight:650; letter-spacing:2px; }
    .brand svg { width:32px; height:32px; }
    .edition { font-size:11px; color:var(--muted); letter-spacing:2px; }
    .intro { display:flex; justify-content:space-between; align-items:flex-end; gap:24px; padding-top:41px; }
    .eyebrow { display:flex; align-items:center; gap:9px; font-size:10px; font-weight:600; letter-spacing:3px; margin:0 0 15px; color:#727a66; }
    .eyebrow::before { content:""; width:22px; height:1px; background:currentColor; }
    h1 { font-size:clamp(33px,4.7vw,60px); font-weight:600; line-height:1.3; letter-spacing:-2px; margin:0; }
    h1 span { color:var(--orange); }
    .intro-note { color:var(--muted); font-size:13px; line-height:1.9; margin:0 2px 5px 0; }
    .scene { position:relative; margin:0 -28px; }
    .scene > svg { display:block; width:100%; height:auto; overflow:hidden; }
    .scene-label { position:absolute; bottom:55px; right:36px; font-size:10px; letter-spacing:2px; color:#697b70; }
    .controls { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:22px; padding:24px 0; border-bottom:1px solid var(--line); }
    .actions { display:flex; align-items:center; gap:12px; }
    .play { border:0; background:var(--ink); color:var(--paper); border-radius:100px; min-height:46px; padding:0 23px; display:flex; align-items:center; justify-content:center; gap:10px; font-size:13px; transition:background .2s,transform .2s; }
    .play:hover { background:#436260; transform:translateY(-1px); }
    .play-icon { font-size:13px; width:12px; }
    .bell { color:var(--ink); background:transparent; border:1px solid #c8cfc2; width:46px; height:46px; border-radius:50%; display:grid; place-items:center; transition:background .2s; }
    .bell:hover { background:#e6e9db; }
    .bell svg { width:19px; height:19px; }
    .pace { display:flex; align-items:center; gap:16px; }
    .pace label { font-size:12px; color:var(--muted); }
    input[type=range] { width:130px; height:24px; accent-color:var(--orange); cursor:pointer; }
    output { font-size:12px; font-variant-numeric:tabular-nums; min-width:30px; }
    .mood { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; }
    .status-dot { width:6px; height:6px; background:#648a69; border-radius:50%; }
    footer { display:flex; justify-content:space-between; gap:20px; margin-top:19px; color:#778176; font-size:10px; letter-spacing:1.2px; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    #bell-note { opacity:0; }
    #bell-note.ringing { animation:bell-note 1.25s ease-out; }
    @keyframes bell-note { 0% { opacity:0; transform:translateY(8px); } 15%,65% { opacity:1; } 100% { opacity:0; transform:translateY(-20px); } }
    @media (min-width:1500px) { .page { padding-top:42px; } }
    @media (max-width:700px) {
      .page { padding:22px 24px; }
      .masthead { padding-bottom:18px; }
      .edition { font-size:9px; letter-spacing:1px; }
      .brand { font-size:11px; letter-spacing:1px; gap:8px; }
      .intro { padding-top:30px; display:block; }
      h1 { font-size:clamp(31px,6.8vw,47px); letter-spacing:-1.3px; }
      .intro-note { margin-top:15px; font-size:12px; }
      .intro-note br { display:none; }
      .scene { margin:16px -24px 0; overflow:hidden; }
      .scene > svg { width:145%; max-width:none; margin-left:-22.5%; }
      .scene-label { display:none; }
      .controls { gap:18px 12px; padding:18px 0; }
      .mood { display:none; }
      .pace { gap:9px; }
      input[type=range] { width:82px; }
      .play { padding:0 17px; }
      footer { font-size:9px; letter-spacing:.6px; }
    }
    @media (max-width:380px) { .controls { justify-content:center; } .pace { justify-content:center; } .edition { max-width:95px; text-align:right; line-height:1.6; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; transition:none!important; } }
  </style>
</head>

  <script>
    (() => {
      'use strict';
      const byId = (id) => document.getElementById(id);
      const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
      const el = Object.fromEntries(['play','play-icon','play-label','speed','speed-value','ride-status','status-dot','announcement','bicycle','rear-spokes','front-spokes','leg-back','leg-front','leg-highlight','foot-back','foot-front','crank','scarf-tail','clouds','water','road','plants','gulls','bell','bell-note'].map(id => [id,byId(id)]));
      let playing = !motionPreference.matches;
      let speed = 1;
      let elapsed = 0;
      let lastTime = null;
      let frameId = null;
      let audioContext = null;
      const setTransform = (id,value) => el[id].setAttribute('transform',value);
      // Solve a two-segment leg so each foot stays on its moving pedal.
      function legAt(angle,near) {
        const x = 560 + Math.cos(angle) * 29;
        const y = 451 + Math.sin(angle) * 29;
        const hipX = near ? 523 : 514;
        const hipY = 328;
        const dx = x - hipX, dy = y - hipY;
        const distance = Math.hypot(dx,dy);
        const thigh = 78, shin = 79;
        const along = (thigh * thigh - shin * shin + distance * distance) / (2 * distance);
        const offset = Math.sqrt(Math.max(0,thigh * thigh - along * along));
        const kneeX = hipX + along * dx / distance + offset * dy / distance;
        const kneeY = hipY + along * dy / distance - offset * dx / distance;
        const path = `M${hipX} ${hipY} L${kneeX.toFixed(2)} ${kneeY.toFixed(2)} L${x.toFixed(2)} ${(y - 4).toFixed(2)}`;
        el[near ? 'leg-front' : 'leg-back'].setAttribute('d',path);
        if (near) el['leg-highlight'].setAttribute('d',path);
        setTransform(near ? 'foot-front' : 'foot-back',`translate(${x} ${y - 4}) rotate(${Math.sin(angle) * 9})`);
        return { x,y };
      }
      function draw() {
        const phase = elapsed * 2.8;
        const wheelAngle = elapsed * 150;
        setTransform('rear-spokes',`rotate(${wheelAngle})`);
        setTransform('front-spokes',`rotate(${wheelAngle})`);
        setTransform('bicycle',`translate(0 ${Math.sin(phase * 2) * 1.1})`);
        const front = legAt(phase,true), back = legAt(phase + Math.PI,false);
        el.crank.setAttribute('d',`M${back.x} ${back.y} L${front.x} ${front.y}`);
        const flutter = Math.sin(elapsed * 7) * 5;
        el['scarf-tail'].setAttribute('d',`M606 237C570 ${225+flutter} 558 ${233-flutter} 531 ${216+flutter}L538 ${237+flutter}C559 ${244-flutter} 577 ${237+flutter} 603 250Z`);
        setTransform('clouds',`translate(${-((elapsed * 10) % 1340)} 0)`);
        setTransform('water',`translate(${-((elapsed * 22) % 250)} 0)`);
        setTransform('plants',`translate(${-((elapsed * 82) % 1340)} 0)`);
        setTransform('road',`translate(${-((elapsed * 259.18) % 170)} 0)`);
        setTransform('gulls',`translate(${Math.sin(elapsed * .28) * 18} ${Math.sin(elapsed * .7) * 4})`);
      }
      function tick(time) {
        frameId = null;
        if (!playing || document.hidden) { lastTime = null; return; }
        if (lastTime !== null) elapsed += Math.min((time - lastTime) / 1000,.05) * speed;
        lastTime = time;
        draw();
        frameId = requestAnimationFrame(tick);
      }
      function schedule() {
        if (playing && !document.hidden && frameId === null) frameId = requestAnimationFrame(tick);
      }
      function syncControls() {
        el['play-icon'].textContent = playing ? 'Ⅱ' : '▶';
        el['play-label'].textContent = playing ? '歇一会儿' : '继续出发';
        el.play.setAttribute('aria-label',playing ? '暂停骑行' : '开始骑行');
        el['ride-status'].textContent = playing ? (speed > 1.5 ? '追上前面那阵海风。' : '海风正好，慢慢骑。') : '停下来，也是一种风景。';
        el['status-dot'].style.background = playing ? '#648a69' : '#b7a682';
      }
      function setPlaying(value) {
        playing = value;
        lastTime = null;
        if (!playing && frameId !== null) { cancelAnimationFrame(frameId); frameId = null; }
        syncControls();
        schedule();
      }
      el.play.addEventListener('click',() => {
        setPlaying(!playing);
        el.announcement.textContent = playing ? '骑行已开始' : '骑行已暂停';
      });
      el.speed.addEventListener('input',() => {
        speed = Number(el.speed.value);
        el['speed-value'].textContent = `${speed}×`;
        el.speed.setAttribute('aria-valuetext',`${speed} 倍速`);
        syncControls();
      });
      el.speed.addEventListener('change',() => { el.announcement.textContent = `骑行节奏已调整为 ${speed} 倍速`; });
      el.bell.addEventListener('click',async () => {
        el.announcement.textContent = '叮铃！鹈鹕向你打了个招呼。';
        el['bell-note'].classList.remove('ringing');
        void el['bell-note'].getBoundingClientRect();
        el['bell-note'].classList.add('ringing');
        try {
          const Audio = window.AudioContext || window.webkitAudioContext;
          if (!Audio) return;
          if (!audioContext) audioContext = new Audio();
          if (audioContext.state === 'suspended') await audioContext.resume();
          const now = audioContext.currentTime;
          for (const delay of [0,.17]) {
            for (const [frequency,volume] of [[1568,.075],[2352,.028],[3136,.012]]) {
              const oscillator = audioContext.createOscillator();
              const gain = audioContext.createGain();
              oscillator.type = 'sine';
              oscillator.frequency.value = frequency;
              gain.gain.setValueAtTime(0,now + delay);
              gain.gain.linearRampToValueAtTime(volume,now + delay + .005);
              gain.gain.exponentialRampToValueAtTime(.0001,now + delay + .9);
              oscillator.connect(gain);
              gain.connect(audioContext.destination);
              oscillator.start(now + delay);
              oscillator.stop(now + delay + 1);
              oscillator.onended = () => { oscillator.disconnect(); gain.disconnect(); };
            }
          }
        } catch (_) { /* The visible bell cue still works if browser audio is unavailable. */ }
      });
      document.addEventListener('visibilitychange',() => { lastTime = null; schedule(); });
      motionPreference.addEventListener('change',event => { if (event.matches) setPlaying(false); });
      draw();
      syncControls();
      schedule();
    })();
  </script>
</body>
</html>
