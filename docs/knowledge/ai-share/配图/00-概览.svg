<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 371" role="img" aria-labelledby="title"><title id="title">你说清需求，Agent 帮忙实现，核对并修改，再把做法留给下次使用。</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#93a5c1" stroke-width="1.4"/></marker></defs><rect width="840" height="371" rx="18" fill="#f8faff"/><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="39" font-size="23" fill="#26364d" font-weight="650">从一个需求，变成一套能再用的做法</text><g transform="translate(49 79)"><rect x="12" y="12" width="115" height="83" rx="12" fill="#e4efff" stroke="#c0d6fb"/><rect x="0" y="0" width="115" height="83" rx="12" fill="#fff" stroke="#bfd5fa"/><path d="M22 24H91M22 39H80M22 54H64" stroke="#75a5f4" stroke-width="6" stroke-linecap="round"/><path d="M21 83V97L39 83" fill="#fff" stroke="#bfd5fa"/><circle cx="110" cy="76" r="21" fill="#2563eb"/><path d="m101 76 6 6 12-13" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/></g><circle cx="40" cy="215" r="12" fill="#2563eb"/><text x="36" y="220" font-size="13" fill="#fff" font-weight="650">1</text><text x="60" y="222" font-size="18" fill="#26364d" font-weight="650">说清想做什么</text><text x="28" y="254" font-size="15" fill="#667791" font-weight="400">整理资料、生成报告</text><text x="28" y="279" font-size="15" fill="#667791" font-weight="400">从一个具体需求开始</text><path d="M194 130h24" stroke="#93a5c1" stroke-width="2" marker-end="url(#arrow)"/><g transform="translate(253 79)"><rect x="0" y="0" width="132" height="93" rx="12" fill="#fff" stroke="#fdc997"/><rect x="0" y="0" width="132" height="22" rx="8" fill="#fff0dc" stroke="#fdc997"/><circle cx="13" cy="11" r="3" fill="#fb923c"/><circle cx="25" cy="11" r="3" fill="#fbbf24"/><circle cx="37" cy="11" r="3" fill="#94d1bd"/><path d="m39 43-13 12 13 12m53-24 13 12-13 12M74 38 61 73" stroke="#ea6a21" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M139-5V13M130 4H148" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/></g><circle cx="244" cy="215" r="12" fill="#c95018"/><text x="240" y="220" font-size="13" fill="#fff" font-weight="650">2</text><text x="264" y="222" font-size="18" fill="#26364d" font-weight="650">Agent 帮忙实现</text><text x="232" y="254" font-size="15" fill="#667791" font-weight="400">读取、查找、计算</text><text x="232" y="279" font-size="15" fill="#667791" font-weight="400">把重复步骤写成程序</text><path d="M398 130h24" stroke="#93a5c1" stroke-width="2" marker-end="url(#arrow)"/><g transform="translate(457 79)"><rect x="3" y="0" width="116" height="99" rx="12" fill="#fff" stroke="#c9ddf8"/><path d="M22 23H89M22 40H78M22 57H66" stroke="#c8dafa" stroke-width="6" stroke-linecap="round"/><circle cx="98" cy="69" r="26" fill="#fff4e4" stroke="#f59e0b" stroke-width="3"/><path d="m117 89 18 18" stroke="#f59e0b" stroke-width="7" stroke-linecap="round"/><path d="m88 70 7 7 13-15" stroke="#d17609" stroke-width="3" fill="none" stroke-linecap="round"/></g><circle cx="448" cy="215" r="12" fill="#b86a0a"/><text x="444" y="220" font-size="13" fill="#fff" font-weight="650">3</text><text x="468" y="222" font-size="18" fill="#26364d" font-weight="650">看结果，改一点</text><text x="436" y="254" font-size="15" fill="#667791" font-weight="400">核对内容与效果</text><text x="436" y="279" font-size="15" fill="#667791" font-weight="400">告诉它哪里需要调整</text><path d="M602 130h24" stroke="#93a5c1" stroke-width="2" marker-end="url(#arrow)"/><g transform="translate(661 79)"><path d="M2 25V10Q2 3 10 3H52L66 19H126Q134 19 134 28V87Q134 97 124 97H12Q2 97 2 87Z" fill="#e1f4ed" stroke="#9fd8c2" stroke-width="2"/><rect x="18" y="24" width="98" height="63" rx="7" fill="#fff" stroke="#bbdfd2"/><path d="M37 45H93M37 59H80" stroke="#a1d2bf" stroke-width="5" stroke-linecap="round"/><circle cx="114" cy="86" r="22" fill="#168465"/><path d="M104 86a10 10 0 1 1 10 10m-10-10v-8m0 8h8" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/></g><circle cx="652" cy="215" r="12" fill="#168465"/><text x="648" y="220" font-size="13" fill="#fff" font-weight="650">4</text><text x="672" y="222" font-size="18" fill="#26364d" font-weight="650">留着，下次再用</text><text x="640" y="254" font-size="15" fill="#667791" font-weight="400">换一批资料</text><text x="640" y="279" font-size="15" fill="#667791" font-weight="400">继续用同一套步骤</text><rect x="28" y="305" width="784" height="44" rx="10" fill="#fff4e7" stroke="#ffe6c6"/><text x="47" y="333" font-size="16" fill="#96511d" font-weight="500">你定目标、核对结果；Agent 把做法写下来，让电脑重复执行。</text></g></svg>