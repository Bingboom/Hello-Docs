<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1030" role="img" aria-labelledby="title"><title id="title">Git 工作过程：在已有仓库中修改并保存文件，用 add 选取改动，再 commit 留下本地版本。反复修改和提交形成历史，需要时再 push 到 GitHub。</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L0 6L6 3Z" fill="#2563eb"/></marker></defs><rect width="420" height="1030" rx="18" fill="#f7faff"/><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="40" font-size="18" fill="#2563eb" font-weight="650" text-anchor="start">先在电脑上存版本，下次还能接着改</text><text x="28" y="72" font-size="15" fill="#667791" font-weight="400" text-anchor="start">前提：这个项目文件夹已经建立了 Git 仓库。</text><rect x="28" y="102" width="364" height="144" rx="14" fill="#ffffff" stroke="#dce6f5"/><text x="44" y="139" font-size="20" fill="#2563eb" font-weight="650" text-anchor="start">修改并保存</text><text x="44" y="182" font-size="16" fill="#26364d" font-weight="400" text-anchor="start">例如给情况卡加搜索</text><text x="44" y="210" font-size="16" fill="#26364d" font-weight="400" text-anchor="start">文件先保存在电脑里</text><path d="M210 255v20" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="28" y="284" width="364" height="144" rx="14" fill="#ffffff" stroke="#dce6f5"/><text x="44" y="321" font-size="20" fill="#2563eb" font-weight="650" text-anchor="start">add · 选好改动</text><text x="44" y="364" font-size="16" fill="#26364d" font-weight="400" text-anchor="start">选这次要存的文件内容</text><text x="44" y="392" font-size="16" fill="#26364d" font-weight="400" text-anchor="start">准备放进这一次存档</text><path d="M210 437v20" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="28" y="466" width="364" height="144" rx="14" fill="#c95018" stroke="#c95018"/><text x="44" y="503" font-size="20" fill="white" font-weight="650" text-anchor="start">commit · 存一版</text><text x="44" y="546" font-size="16" fill="#eaf2ff" font-weight="400" text-anchor="start">写下“增加按学生搜索”</text><text x="44" y="574" font-size="16" fill="#eaf2ff" font-weight="400" text-anchor="start">正式留下一次版本记录</text><rect x="28" y="643" width="364" height="161" rx="14" fill="#eef8f4" stroke="#dce6f5"/><text x="46" y="677" font-size="19" fill="#2563eb" font-weight="650" text-anchor="start">电脑里的版本历史</text><text x="46" y="713" font-size="16" fill="#26364d" font-weight="400" text-anchor="start">第一版：能生成情况卡</text><text x="46" y="742" font-size="16" fill="#26364d" font-weight="400" text-anchor="start">第二版：增加按学生搜索</text><text x="46" y="771" font-size="16" fill="#26364d" font-weight="400" text-anchor="start">下一版：继续修改，再存一版</text><path d="M210 815V849" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6" marker-end="url(#arr)"/><text x="230" y="838" font-size="14" fill="#667791" font-weight="400" text-anchor="start">需要时再上传</text><rect x="28" y="868" width="364" height="92" rx="14" fill="#fff2dc" stroke="#fed4a4"/><text x="46" y="902" font-size="21" fill="#c3531b" font-weight="650" text-anchor="start">Push → GitHub</text><text x="46" y="935" font-size="16" fill="#26364d" font-weight="400" text-anchor="start">把本地版本同步到网上</text><text x="28" y="998" font-size="16" fill="#2563eb" font-weight="600" text-anchor="start">Desktop：查看改动 → 勾选 → Commit</text></g></svg>