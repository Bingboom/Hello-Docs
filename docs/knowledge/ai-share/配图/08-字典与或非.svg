<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 640" role="img" aria-labelledby="title"><title id="title">按老师的要求，找到学生资料、筛选未沟通的学生、列出名单，更新资料后再次使用。</title><rect width="840" height="640" rx="18" fill="#f8faff"/><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="42" font-size="24" fill="#26364d" font-weight="650">帮我列一份待沟通名单</text><text x="28" y="70" font-size="15" fill="#667791" font-weight="400">另一组虚构记录：把老师的要求，变成可以重复执行的步骤。</text><rect x="28" y="94" width="784" height="100" rx="14" fill="#fff" stroke="#dce6f5"/><circle cx="60" cy="120" r="13" fill="#2563eb"/><text x="56" y="125" font-size="13" fill="#fff" font-weight="650">1</text><text x="83" y="126" font-size="19" fill="#2563eb" font-weight="650">找到学生资料</text><rect x="48" y="146" width="110" height="29" rx="7" fill="#eaf2ff" stroke="none"/><text x="63" y="166" font-size="14" fill="#2563eb" font-weight="600">按学号查找</text><text x="179" y="166" font-size="17" fill="#26364d" font-weight="400">→   成绩变化  ＋  家长反馈  ＋  沟通记录</text><rect x="28" y="214" width="784" height="226" rx="14" fill="#fff" stroke="#dce6f5"/><circle cx="60" cy="242" r="13" fill="#c95018"/><text x="56" y="247" font-size="13" fill="#fff" font-weight="650">2</text><text x="83" y="248" font-size="19" fill="#c95018" font-weight="650">按老师的要求筛选</text><text x="48" y="280" font-size="16" fill="#26364d" font-weight="400">成绩下降了，或者家长有反馈，就先找出来；已经沟通过的，这次先不列入。</text><rect x="48" y="298" width="744" height="32" rx="5" fill="#f3f6fb" stroke="none"/><text x="63" y="320" font-size="14" fill="#667791" font-weight="600">学生</text><text x="148" y="320" font-size="14" fill="#667791" font-weight="600">资料里的情况</text><text x="675" y="320" font-size="14" fill="#667791" font-weight="600">本次是否列入</text><text x="63" y="355" font-size="16" fill="#26364d" font-weight="600">张三</text><text x="148" y="355" font-size="15" fill="#26364d" font-weight="400">成绩下降 · 无反馈 · 未沟通</text><text x="683" y="355" font-size="15" fill="#168465" font-weight="600">列入</text><text x="63" y="387" font-size="16" fill="#26364d" font-weight="600">李四</text><text x="148" y="387" font-size="15" fill="#26364d" font-weight="400">成绩未下降 · 有反馈 · 未沟通</text><text x="683" y="387" font-size="15" fill="#168465" font-weight="600">列入</text><text x="63" y="419" font-size="16" fill="#26364d" font-weight="600">王五</text><text x="148" y="419" font-size="15" fill="#26364d" font-weight="400">成绩下降 · 有反馈 · 已沟通</text><text x="683" y="419" font-size="15" fill="#71809a" font-weight="600">暂不列入</text><rect x="28" y="460" width="370" height="114" rx="14" fill="#eef9f4" stroke="#c6e7d7"/><circle cx="60" cy="488" r="13" fill="#168465"/><text x="56" y="493" font-size="13" fill="#fff" font-weight="650">3</text><text x="83" y="494" font-size="19" fill="#168465" font-weight="650">列出名单</text><text x="48" y="532" font-size="24" fill="#168465" font-weight="650">张三、李四</text><text x="48" y="555" font-size="14" fill="#667791" font-weight="400">老师核对后，再安排沟通。</text><rect x="418" y="460" width="394" height="114" rx="14" fill="#fff6eb" stroke="#ffe0bc"/><circle cx="450" cy="488" r="13" fill="#c95018"/><text x="446" y="493" font-size="13" fill="#fff" font-weight="650">4</text><text x="473" y="494" font-size="19" fill="#c95018" font-weight="650">更新后，再查一次</text><text x="438" y="528" font-size="15" fill="#26364d" font-weight="400">换成最新资料，继续按同样的要求筛选。</text><text x="438" y="554" font-size="14" fill="#667791" font-weight="400">要求变了，再让 Agent 修改规则。</text><text x="28" y="611" font-size="17" fill="#34435d" font-weight="550">你把要求说清楚，程序就能逐条处理，不用每个人都重新查一遍。</text></g></svg>