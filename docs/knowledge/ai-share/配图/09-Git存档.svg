<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" role="img" aria-labelledby="title"><title id="title">Git 工作过程：在已有仓库中修改并保存文件，用 add 选取改动，再 commit 留下本地版本。反复修改和提交形成历史，需要时再 push 到 GitHub。</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L0 6L6 3Z" fill="#2563eb"/></marker></defs><rect width="900" height="680" rx="18" fill="#f7faff"/><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="40" font-size="22" fill="#2563eb" font-weight="650" text-anchor="start">先在电脑上存版本，下次还能接着改</text><text x="28" y="72" font-size="15" fill="#667791" font-weight="400" text-anchor="start">前提：这个项目文件夹已经建立了 Git 仓库。</text><rect x="28" y="113" width="239" height="144" rx="14" fill="#ffffff" stroke="#dce6f5"/><text x="44" y="150" font-size="20" fill="#2563eb" font-weight="650" text-anchor="start">修改并保存</text><text x="44" y="193" font-size="16" fill="#26364d" font-weight="400" text-anchor="start">例如给情况卡加搜索</text><text x="44" y="221" font-size="16" fill="#26364d" font-weight="400" text-anchor="start">文件先保存在电脑里</text><path d="M276 184h44" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="330" y="113" width="239" height="144" rx="14" fill="#ffffff" stroke="#dce6f5"/><text x="346" y="150" font-size="20" fill="#2563eb" font-weight="650" text-anchor="start">add · 选好改动</text><text x="346" y="193" font-size="16" fill="#26364d" font-weight="400" text-anchor="start">选这次要存的文件内容</text><text x="346" y="221" font-size="16" fill="#26364d" font-weight="400" text-anchor="start">准备放进这一次存档</text><path d="M578 184h44" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="633" y="113" width="239" height="144" rx="14" fill="#c95018" stroke="#c95018"/><text x="649" y="150" font-size="20" fill="white" font-weight="650" text-anchor="start">commit · 存一版</text><text x="649" y="193" font-size="16" fill="#eaf2ff" font-weight="400" text-anchor="start">写下“增加按学生搜索”</text><text x="649" y="221" font-size="16" fill="#eaf2ff" font-weight="400" text-anchor="start">正式留下一次版本记录</text><path d="M749 269V301H147V271" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6" marker-end="url(#arr)"/><text x="336" y="329" font-size="18" fill="#2563eb" font-weight="600" text-anchor="start">继续修改，再选好改动、存一版</text><rect x="28" y="360" width="844" height="142" rx="14" fill="#eef8f4" stroke="#dce6f5"/><text x="49" y="395" font-size="20" fill="#2563eb" font-weight="650" text-anchor="start">电脑里的版本历史</text><path d="M88 433H777" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="89" cy="433" r="7" fill="#2563eb"/><text x="89" y="472" font-size="16" fill="#26364d" font-weight="500" text-anchor="start">能生成情况卡</text><circle cx="375" cy="433" r="7" fill="#2563eb"/><text x="375" y="472" font-size="16" fill="#26364d" font-weight="500" text-anchor="middle">增加按学生搜索</text><circle cx="750" cy="433" r="7" fill="#2563eb"/><text x="750" y="472" font-size="16" fill="#26364d" font-weight="500" text-anchor="middle">继续改，再存一版</text><text x="28" y="545" font-size="18" fill="#2563eb" font-weight="600" text-anchor="start">GitHub Desktop：查看改动 → 勾选文件 → 填写说明 → Commit</text><path d="M111 558V596H242" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6" marker-end="url(#arr)"/><text x="28" y="626" font-size="16" fill="#667791" font-weight="400" text-anchor="start">需要时再上传</text><rect x="263" y="571" width="609" height="76" rx="14" fill="#fff2dc" stroke="#fed4a4"/><text x="283" y="603" font-size="20" fill="#c3531b" font-weight="650" text-anchor="start">Push → GitHub</text><text x="283" y="630" font-size="16" fill="#26364d" font-weight="400" text-anchor="start">把本地版本同步到网上；本地存档不需要先上传。</text></g></svg>