<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" role="img" aria-labelledby="title"><title id="title">协作方式：人说明目标，Agent 编写运行代码，人核对结果并反馈修改。</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L0 6L6 3Z" fill="#2563eb"/></marker></defs><rect width="840" height="330" rx="18" fill="#f7faff"/><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="40" font-size="22" fill="#2563eb" font-weight="650" text-anchor="start">你说清要求，Agent 执行，你核对</text><rect x="28" y="77" width="246" height="145" rx="14" fill="#ffffff" stroke="#dce6f5"/><circle cx="56" cy="104" r="17" fill="#c3531b"/><text x="56" y="110" font-size="16" fill="white" font-weight="600" text-anchor="middle">1</text><text x="83" y="111" font-size="19" fill="#2563eb" font-weight="650" text-anchor="start">你</text><text x="46" y="147" font-size="18" fill="#26364d" font-weight="600" text-anchor="start">说明要做什么</text><text x="46" y="177" font-size="15" fill="#667791" font-weight="400" text-anchor="start">每个学生一页</text><text x="46" y="201" font-size="15" fill="#667791" font-weight="400" text-anchor="start">算出成绩变化</text><path d="M279 149h20" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="306" y="77" width="246" height="145" rx="14" fill="#c95018" stroke="#c95018"/><circle cx="334" cy="104" r="17" fill="#60a5fa"/><text x="334" y="110" font-size="16" fill="white" font-weight="600" text-anchor="middle">2</text><text x="361" y="111" font-size="19" fill="white" font-weight="650" text-anchor="start">Agent</text><text x="324" y="147" font-size="18" fill="white" font-weight="600" text-anchor="start">编写并运行代码</text><text x="324" y="177" font-size="15" fill="#eaf2ff" font-weight="400" text-anchor="start">读取、匹配、计算</text><text x="324" y="201" font-size="15" fill="#eaf2ff" font-weight="400" text-anchor="start">生成可以查看的结果</text><path d="M557 149h20" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="584" y="77" width="246" height="145" rx="14" fill="#ffffff" stroke="#dce6f5"/><circle cx="612" cy="104" r="17" fill="#c3531b"/><text x="612" y="110" font-size="16" fill="white" font-weight="600" text-anchor="middle">3</text><text x="639" y="111" font-size="19" fill="#2563eb" font-weight="650" text-anchor="start">你</text><text x="602" y="147" font-size="18" fill="#26364d" font-weight="600" text-anchor="start">看结果，提修改</text><text x="602" y="177" font-size="15" fill="#667791" font-weight="400" text-anchor="start">记录有没有放错？</text><text x="602" y="201" font-size="15" fill="#667791" font-weight="400" text-anchor="start">打印有没有截断？</text><text x="28" y="305" font-size="17" fill="#2563eb" font-weight="600" text-anchor="start">把发现的问题说清楚，再让 Agent 修改。</text></g></svg>