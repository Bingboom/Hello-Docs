<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 940" role="img" aria-labelledby="title"><title id="title">GitHub 使用过程：找项目，下载到电脑，让 Agent 帮忙运行和修改，再保存版本。</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L0 6L6 3Z" fill="#2563eb"/></marker></defs><rect width="420" height="940" rx="18" fill="#f7faff"/><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="40" font-size="18" fill="#2563eb" font-weight="650" text-anchor="start">现成项目，怎样变成自己的练手起点</text><rect x="28" y="75" width="364" height="160" rx="14" fill="#ffffff" stroke="#dce6f5"/><circle cx="57" cy="105" r="17" fill="#2563eb"/><text x="57" y="111" font-size="16" fill="white" font-weight="600" text-anchor="middle">1</text><text x="85" y="111" font-size="21" fill="#2563eb" font-weight="650" text-anchor="start">GitHub 上找</text><text x="48" y="159" font-size="17" fill="#26364d" font-weight="400" text-anchor="start">看介绍、效果、使用说明</text><text x="48" y="191" font-size="17" fill="#26364d" font-weight="400" text-anchor="start">挑一个功能接近的项目</text><path d="M210 240v25" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="28" y="278" width="364" height="160" rx="14" fill="#ffffff" stroke="#dce6f5"/><circle cx="57" cy="308" r="17" fill="#2563eb"/><text x="57" y="314" font-size="16" fill="white" font-weight="600" text-anchor="middle">2</text><text x="85" y="314" font-size="21" fill="#2563eb" font-weight="650" text-anchor="start">下载到电脑</text><text x="48" y="352" font-size="17" fill="#2563eb" font-weight="650" text-anchor="start">建议用 GitHub Desktop 操作</text><text x="48" y="383" font-size="16" fill="#26364d" font-weight="400" text-anchor="start">网页 Fork：账号里留一份副本</text><text x="48" y="410" font-size="16" fill="#26364d" font-weight="400" text-anchor="start">Desktop 中 Clone：下载到电脑</text><path d="M210 443v25" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="28" y="481" width="364" height="160" rx="14" fill="#ffffff" stroke="#dce6f5"/><circle cx="57" cy="511" r="17" fill="#2563eb"/><text x="57" y="517" font-size="16" fill="white" font-weight="600" text-anchor="middle">3</text><text x="85" y="517" font-size="21" fill="#2563eb" font-weight="650" text-anchor="start">让 Agent 帮忙运行</text><text x="48" y="565" font-size="17" fill="#26364d" font-weight="400" text-anchor="start">先看原来的功能</text><text x="48" y="597" font-size="17" fill="#26364d" font-weight="400" text-anchor="start">再按自己的需要改一点</text><path d="M210 646v25" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="28" y="684" width="364" height="160" rx="14" fill="#ffffff" stroke="#dce6f5"/><circle cx="57" cy="714" r="17" fill="#c3531b"/><text x="57" y="720" font-size="16" fill="white" font-weight="600" text-anchor="middle">4</text><text x="85" y="720" font-size="21" fill="#2563eb" font-weight="650" text-anchor="start">保存一个可用版本</text><text x="48" y="768" font-size="17" fill="#26364d" font-weight="400" text-anchor="start">Commit：本地存一版</text><text x="48" y="800" font-size="17" fill="#26364d" font-weight="400" text-anchor="start">Push：把版本上传到 GitHub</text><text x="28" y="917" font-size="16" fill="#667791" font-weight="400" text-anchor="start">上传代码是保存和分享版本，网页上线是另一件事。</text></g></svg>