<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 590" role="img" aria-labelledby="title"><title id="title">找到张三的成绩，从期中70分到期末90分，算出变化为正20分，写入提高20分。其他学生按相同规则写提高、下降或持平。</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L0 6L6 3Z" fill="#2563eb"/></marker></defs><rect width="840" height="590" rx="18" fill="#f7faff"/><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="40" font-size="22" fill="#2563eb" font-weight="650" text-anchor="start">张三的“提高 20 分”怎样得到？</text><rect x="28" y="77" width="245" height="142" rx="14" fill="#ffffff" stroke="#dce6f5"/><text x="47" y="111" font-size="20" fill="#2563eb" font-weight="650" text-anchor="start">① 找到成绩</text><text x="47" y="143" font-size="16" fill="#667791" font-weight="400" text-anchor="start">学号：S001 · 张三</text><text x="47" y="169" font-size="16" fill="#667791" font-weight="400" text-anchor="start">数学：期中 70 → 期末 90</text><path d="M282 148H321" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="336" y="77" width="248" height="142" rx="14" fill="#fff2dc" stroke="#f59e0b"/><text x="355" y="111" font-size="20" fill="#2563eb" font-weight="650" text-anchor="start">② 算出变化</text><text x="460" y="168" font-size="23" fill="#c3531b" font-weight="600" text-anchor="middle">90 − 70 = +20 分</text><path d="M596 148H629" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="645" y="77" width="169" height="142" rx="14" fill="#eef8f4" stroke="#dce6f5"/><text x="662" y="111" font-size="19" fill="#2563eb" font-weight="600" text-anchor="start">③ 写入结果</text><text x="662" y="148" font-size="17" fill="#2563eb" font-weight="400" text-anchor="start">张三 · 数学</text><text x="662" y="176" font-size="17" fill="#2563eb" font-weight="400" text-anchor="start">提高 20 分</text><rect x="28" y="267" width="786" height="142" rx="14" fill="#ffffff" stroke="#dce6f5"/><text x="49" y="303" font-size="18" fill="#2563eb" font-weight="600" text-anchor="start">换成其他学生，也按同样的规则判断提高、下降或持平</text><text x="49" y="339" font-size="17" fill="#26364d" font-weight="600" text-anchor="start">正数，例如 +20</text><text x="49" y="373" font-size="17" fill="#667791" font-weight="400" text-anchor="start">写“提高 20 分”</text><text x="305" y="339" font-size="17" fill="#26364d" font-weight="600" text-anchor="start">负数，例如 −6</text><text x="305" y="373" font-size="17" fill="#667791" font-weight="400" text-anchor="start">写“下降 6 分”</text><text x="561" y="339" font-size="17" fill="#26364d" font-weight="600" text-anchor="start">变化为 0</text><text x="561" y="373" font-size="17" fill="#667791" font-weight="400" text-anchor="start">写“持平”</text><path d="M729 225V247" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><path d="M729 425V467H14V239H132V225" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6" marker-end="url(#arr)"/><text x="219" y="503" font-size="19" fill="#2563eb" font-weight="650" text-anchor="start">④ 处理下一个学生，继续查找、计算、写入</text><text x="219" y="536" font-size="16" fill="#667791" font-weight="400" text-anchor="start">人先定规则，程序照着规则重复执行。</text></g></svg>