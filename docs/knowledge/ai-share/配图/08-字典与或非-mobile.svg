<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 982" role="img" aria-labelledby="title"><title id="title">按老师的要求，找到学生资料、筛选未沟通的学生、列出名单，更新资料后再次使用。</title><rect width="420" height="982" rx="18" fill="#f8faff"/><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="40" font-size="23" fill="#26364d" font-weight="650">帮我列一份待沟通名单</text><text x="24" y="68" font-size="14" fill="#667791" font-weight="400">另一组虚构记录 · 同一套要求，逐条处理</text><rect x="24" y="90" width="372" height="130" rx="14" fill="#fff" stroke="#dce6f5"/><circle cx="54" cy="120" r="13" fill="#2563eb"/><text x="50" y="125" font-size="13" fill="#fff" font-weight="650">1</text><text x="77" y="126" font-size="19" fill="#2563eb" font-weight="650">找到学生资料</text><text x="42" y="163" font-size="15" fill="#26364d" font-weight="400">按学号，把同一个学生的资料放到一起。</text><text x="42" y="193" font-size="15" fill="#2563eb" font-weight="400">成绩变化 ＋ 家长反馈 ＋ 沟通记录</text><rect x="24" y="240" width="372" height="400" rx="14" fill="#fff" stroke="#dce6f5"/><circle cx="54" cy="270" r="13" fill="#c95018"/><text x="50" y="275" font-size="13" fill="#fff" font-weight="650">2</text><text x="77" y="276" font-size="19" fill="#c95018" font-weight="650">按老师的要求筛选</text><text x="42" y="311" font-size="16" fill="#26364d" font-weight="400">成绩下降了，或者家长有反馈，</text><text x="42" y="337" font-size="16" fill="#26364d" font-weight="400">就先找出来；已经沟通过的，</text><text x="42" y="363" font-size="16" fill="#26364d" font-weight="400">这次先不列入。</text><rect x="40" y="383" width="340" height="64" rx="8" fill="#f6f8fc" stroke="none"/><text x="53" y="405" font-size="17" fill="#26364d" font-weight="600">张三</text><text x="296" y="405" font-size="14" fill="#168465" font-weight="600">列入</text><text x="53" y="431" font-size="14" fill="#667791" font-weight="400">成绩下降 · 无反馈 · 未沟通</text><rect x="40" y="459" width="340" height="64" rx="8" fill="#f6f8fc" stroke="none"/><text x="53" y="481" font-size="17" fill="#26364d" font-weight="600">李四</text><text x="296" y="481" font-size="14" fill="#168465" font-weight="600">列入</text><text x="53" y="507" font-size="14" fill="#667791" font-weight="400">成绩未下降 · 有反馈 · 未沟通</text><rect x="40" y="535" width="340" height="64" rx="8" fill="#f6f8fc" stroke="none"/><text x="53" y="557" font-size="17" fill="#26364d" font-weight="600">王五</text><text x="296" y="557" font-size="14" fill="#71809a" font-weight="600">暂不列入</text><text x="53" y="583" font-size="14" fill="#667791" font-weight="400">成绩下降 · 有反馈 · 已沟通</text><rect x="24" y="660" width="372" height="120" rx="14" fill="#eef9f4" stroke="#c6e7d7"/><circle cx="54" cy="690" r="13" fill="#168465"/><text x="50" y="695" font-size="13" fill="#fff" font-weight="650">3</text><text x="77" y="696" font-size="19" fill="#168465" font-weight="650">列出名单</text><text x="42" y="732" font-size="23" fill="#168465" font-weight="650">张三、李四</text><text x="42" y="760" font-size="14" fill="#667791" font-weight="400">老师核对后，再安排沟通。</text><rect x="24" y="800" width="372" height="122" rx="14" fill="#fff6eb" stroke="#ffe0bc"/><circle cx="54" cy="830" r="13" fill="#c95018"/><text x="50" y="835" font-size="13" fill="#fff" font-weight="650">4</text><text x="77" y="836" font-size="19" fill="#c95018" font-weight="650">更新后，再查一次</text><text x="42" y="872" font-size="15" fill="#26364d" font-weight="400">换成最新资料，继续按同样的要求筛选。</text><text x="42" y="898" font-size="14" fill="#667791" font-weight="400">要求变了，再让 Agent 修改规则。</text><text x="24" y="957" font-size="16" fill="#26364d" font-weight="550">你把要求说清楚，程序就能逐条处理。</text></g></svg>