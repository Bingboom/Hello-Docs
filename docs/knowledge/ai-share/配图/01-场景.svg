<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 443" role="img" aria-labelledby="title"><title id="title">成绩、课堂表现和家访记录，经过 Agent 编写的程序，生成三位学生的情况卡。</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#93a5c1" stroke-width="1.4"/></marker></defs><rect width="840" height="443" rx="18" fill="#f8faff"/><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="39" font-size="23" fill="#26364d" font-weight="650">几份资料，变成每个学生的一张情况卡</text><text x="28" y="72" font-size="13" fill="#71809a" font-weight="400">班主任例子 · 虚构资料</text><rect x="30" y="100" width="212" height="86" rx="10" fill="#fff" stroke="#c9dcfc"/><rect x="44" y="113" width="5" height="24" rx="2" fill="#60a5fa" stroke="none"/><text x="59" y="131" font-size="17" fill="#2563eb" font-weight="650">成绩</text><text x="45" y="162" font-size="14" fill="#667791" font-weight="400">期中 70 → 期末 90</text><rect x="44" y="169" width="212" height="86" rx="10" fill="#fff" stroke="#c9dcfc"/><rect x="58" y="182" width="5" height="24" rx="2" fill="#60a5fa" stroke="none"/><text x="73" y="200" font-size="17" fill="#2563eb" font-weight="650">课堂表现</text><text x="59" y="231" font-size="14" fill="#667791" font-weight="400">主动举手</text><rect x="58" y="238" width="212" height="86" rx="10" fill="#fff" stroke="#c9dcfc"/><rect x="72" y="251" width="5" height="24" rx="2" fill="#60a5fa" stroke="none"/><text x="87" y="269" font-size="17" fill="#2563eb" font-weight="650">家访记录</text><text x="73" y="300" font-size="14" fill="#667791" font-weight="400">主动安排作业</text><path d="M272 228h43" stroke="#93a5c1" stroke-width="2" marker-end="url(#arrow)"/><rect x="333" y="141" width="181" height="160" rx="18" fill="#fff4e7" stroke="#ffdbb1"/><g transform="translate(359 96)"><rect x="0" y="0" width="132" height="93" rx="12" fill="#fff" stroke="#fdc997"/><rect x="0" y="0" width="132" height="22" rx="8" fill="#fff0dc" stroke="#fdc997"/><circle cx="13" cy="11" r="3" fill="#fb923c"/><circle cx="25" cy="11" r="3" fill="#fbbf24"/><circle cx="37" cy="11" r="3" fill="#94d1bd"/><path d="m39 43-13 12 13 12m53-24 13 12-13 12M74 38 61 73" stroke="#ea6a21" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M139-5V13M130 4H148" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/></g><text x="354" y="229" font-size="21" fill="#b34e1d" font-weight="650">Agent + 代码</text><text x="356" y="258" font-size="15" fill="#9a5b35" font-weight="400">找资料 · 算变化</text><text x="356" y="281" font-size="15" fill="#9a5b35" font-weight="400">统一排好版</text><path d="M526 228h40" stroke="#93a5c1" stroke-width="2" marker-end="url(#arrow)"/><rect x="587" y="90" width="224" height="92" rx="12" fill="#fff" stroke="#dce6f5"/><circle cx="614" cy="116" r="14" fill="#edf4ff"/><text x="607" y="121" font-size="13" fill="#2563eb" font-weight="600">张</text><text x="637" y="120" font-size="18" fill="#26364d" font-weight="650">张三</text><text x="760" y="118" font-size="12" fill="#758299" font-weight="400">S001</text><text x="603" y="146" font-size="16" fill="#168465" font-weight="600">数学提高 20 分</text><text x="603" y="168" font-size="13" fill="#667791" font-weight="400">家访：有记录</text><rect x="587" y="192" width="224" height="92" rx="12" fill="#fff" stroke="#dce6f5"/><circle cx="614" cy="218" r="14" fill="#edf4ff"/><text x="607" y="223" font-size="13" fill="#2563eb" font-weight="600">李</text><text x="637" y="222" font-size="18" fill="#26364d" font-weight="650">李四</text><text x="760" y="220" font-size="12" fill="#758299" font-weight="400">S002</text><text x="603" y="248" font-size="16" fill="#c3531b" font-weight="600">数学下降 6 分</text><text x="603" y="270" font-size="13" fill="#667791" font-weight="400">家访：有记录</text><rect x="587" y="294" width="224" height="92" rx="12" fill="#fff" stroke="#dce6f5"/><circle cx="614" cy="320" r="14" fill="#edf4ff"/><text x="607" y="325" font-size="13" fill="#2563eb" font-weight="600">王</text><text x="637" y="324" font-size="18" fill="#26364d" font-weight="650">王五</text><text x="760" y="322" font-size="12" fill="#758299" font-weight="400">S003</text><text x="603" y="350" font-size="16" fill="#c3531b" font-weight="600">数学下降 2 分</text><text x="603" y="372" font-size="13" fill="#667791" font-weight="400">家访：暂无记录</text><path d="M577 399H147V348" fill="none" stroke="#60a5fa" stroke-dasharray="5 6" stroke-width="2" marker-end="url(#arrow)"/><rect x="234" y="382" width="280" height="34" rx="17" fill="#eaf3ff" stroke="none"/><text x="255" y="405" font-size="17" fill="#2563eb" font-weight="600">下次换资料，再生成一次 ↻</text></g></svg>