<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 750" role="img" aria-labelledby="title"><title id="title">MCP 使用示意：授权读取钉钉表格，Agent 借助代码匹配计算，再通过 MCP 写入新文档，由人核对。</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L0 6L6 3Z" fill="#2563eb"/></marker></defs><rect width="420" height="750" rx="18" fill="#f7faff"/><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="40" font-size="18" fill="#2563eb" font-weight="650" text-anchor="start">资料在线上，处理过程仍然看得清楚</text><rect x="28" y="80" width="364" height="151" rx="14" fill="#ffffff" stroke="#dce6f5"/><text x="46" y="120" font-size="21" fill="#2563eb" font-weight="650" text-anchor="start">钉钉表格</text><text x="46" y="161" font-size="17" fill="#26364d" font-weight="400" text-anchor="start">成绩、课堂表现</text><text x="46" y="193" font-size="17" fill="#26364d" font-weight="400" text-anchor="start">家访记录</text><path d="M210 240v31" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="231" y="264" font-size="14" fill="#2563eb" font-weight="400" text-anchor="start">MCP 读取</text><rect x="28" y="285" width="364" height="151" rx="14" fill="#c95018" stroke="#c95018"/><text x="46" y="325" font-size="21" fill="white" font-weight="650" text-anchor="start">Agent + 代码</text><text x="46" y="366" font-size="17" fill="#eaf2ff" font-weight="400" text-anchor="start">按学号匹配</text><text x="46" y="398" font-size="17" fill="#eaf2ff" font-weight="400" text-anchor="start">计算分数变化</text><path d="M210 445v31" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="231" y="469" font-size="14" fill="#2563eb" font-weight="400" text-anchor="start">MCP 写入</text><rect x="28" y="490" width="364" height="151" rx="14" fill="#ffffff" stroke="#dce6f5"/><text x="46" y="530" font-size="21" fill="#2563eb" font-weight="650" text-anchor="start">新的钉钉文档</text><text x="46" y="571" font-size="17" fill="#26364d" font-weight="400" text-anchor="start">每位学生一个小节</text><text x="46" y="603" font-size="17" fill="#26364d" font-weight="400" text-anchor="start">保留原始表格</text><rect x="28" y="672" width="364" height="51" rx="14" fill="#fff2dc" stroke="#fed4a4"/><text x="210.0" y="704" font-size="17" fill="#c3531b" font-weight="600" text-anchor="middle">先连接并授权；生成后，人再打开核对。</text></g></svg>