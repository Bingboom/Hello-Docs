<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 890" role="img" aria-labelledby="title"><title id="title">场景示意：三份资料经过 Agent 编写的程序，生成三位学生的情况卡；换资料后可以重复使用。</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L0 6L6 3Z" fill="#2563eb"/></marker></defs><rect width="420" height="890" rx="18" fill="#f7faff"/><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="40" font-size="18" fill="#2563eb" font-weight="650" text-anchor="start">同一批资料，可以生成每个人的材料</text><rect x="34" y="62" width="360" height="130" rx="14" fill="#eaf2ff" stroke="#dce6f5"/><rect x="28" y="67" width="360" height="130" rx="14" fill="#ffffff" stroke="#dce6f5"/><rect x="28" y="67" width="360" height="6" rx="3" fill="#c95018"/><text x="44" y="101" font-size="18" fill="#2563eb" font-weight="600" text-anchor="start">成绩 · 课堂表现 · 家访记录</text><text x="44" y="133" font-size="15" fill="#667791" font-weight="400" text-anchor="start">张三：数学 70 → 90</text><text x="44" y="160" font-size="15" fill="#667791" font-weight="400" text-anchor="start">课堂：主动举手；家访：主动安排作业</text><path d="M210 209V243" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="28" y="258" width="360" height="120" rx="14" fill="#c95018" stroke="#c95018"/><text x="50" y="294" font-size="21" fill="white" font-weight="650" text-anchor="start">Agent 把要求写成程序</text><text x="50" y="326" font-size="16" fill="#eaf2ff" font-weight="400" text-anchor="start">按学生找资料 → 计算变化 → 排版</text><path d="M210 389V421" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="28" y="436" width="360" height="111" rx="14" fill="#ffffff" stroke="#dce6f5"/><text x="44" y="464" font-size="20" fill="#2563eb" font-weight="650" text-anchor="start">张三</text><text x="372" y="464" font-size="13" fill="#667791" font-weight="400" text-anchor="end">S001</text><text x="44" y="492" font-size="17" fill="#2563eb" font-weight="600" text-anchor="start">数学提高 20 分</text><text x="44" y="518" font-size="14" fill="#667791" font-weight="400" text-anchor="start">家访：有记录</text><rect x="28" y="562" width="360" height="111" rx="14" fill="#ffffff" stroke="#dce6f5"/><text x="44" y="590" font-size="20" fill="#2563eb" font-weight="650" text-anchor="start">李四</text><text x="372" y="590" font-size="13" fill="#667791" font-weight="400" text-anchor="end">S002</text><text x="44" y="618" font-size="17" fill="#c3531b" font-weight="600" text-anchor="start">数学下降 6 分</text><text x="44" y="644" font-size="14" fill="#667791" font-weight="400" text-anchor="start">家访：有记录</text><rect x="28" y="688" width="360" height="111" rx="14" fill="#ffffff" stroke="#dce6f5"/><text x="44" y="716" font-size="20" fill="#2563eb" font-weight="650" text-anchor="start">王五</text><text x="372" y="716" font-size="13" fill="#667791" font-weight="400" text-anchor="end">S003</text><text x="44" y="744" font-size="17" fill="#c3531b" font-weight="600" text-anchor="start">数学下降 2 分</text><text x="44" y="770" font-size="14" fill="#667791" font-weight="400" text-anchor="start">家访：暂无记录</text><text x="28" y="848" font-size="18" fill="#2563eb" font-weight="600" text-anchor="start">下次换新资料，继续用这个程序。</text></g></svg>