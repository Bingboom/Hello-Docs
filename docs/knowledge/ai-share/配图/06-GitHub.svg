<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 540" role="img" aria-labelledby="title"><title id="title">GitHub 使用过程：找项目，下载到电脑，让 Agent 帮忙运行和修改，再保存版本。</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L0 6L6 3Z" fill="#2563eb"/></marker></defs><rect width="840" height="540" rx="18" fill="#f7faff"/><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="40" font-size="22" fill="#2563eb" font-weight="650" text-anchor="start">现成项目，怎样变成自己的练手起点</text><rect x="28" y="83" width="366" height="160" rx="14" fill="#ffffff" stroke="#dce6f5"/><circle cx="57" cy="113" r="17" fill="#2563eb"/><text x="57" y="119" font-size="16" fill="white" font-weight="600" text-anchor="middle">1</text><text x="85" y="119" font-size="21" fill="#2563eb" font-weight="650" text-anchor="start">GitHub 上找</text><text x="48" y="167" font-size="17" fill="#26364d" font-weight="400" text-anchor="start">看介绍、效果、使用说明</text><text x="48" y="199" font-size="17" fill="#26364d" font-weight="400" text-anchor="start">挑一个功能接近的项目</text><rect x="445" y="83" width="366" height="160" rx="14" fill="#ffffff" stroke="#dce6f5"/><circle cx="474" cy="113" r="17" fill="#2563eb"/><text x="474" y="119" font-size="16" fill="white" font-weight="600" text-anchor="middle">2</text><text x="502" y="119" font-size="21" fill="#2563eb" font-weight="650" text-anchor="start">下载到电脑</text><text x="465" y="157" font-size="17" fill="#2563eb" font-weight="650" text-anchor="start">建议用 GitHub Desktop 操作</text><text x="465" y="188" font-size="16" fill="#26364d" font-weight="400" text-anchor="start">网页 Fork：账号里留一份副本</text><text x="465" y="215" font-size="16" fill="#26364d" font-weight="400" text-anchor="start">Desktop 中 Clone：下载到电脑</text><rect x="28" y="304" width="366" height="160" rx="14" fill="#ffffff" stroke="#dce6f5"/><circle cx="57" cy="334" r="17" fill="#2563eb"/><text x="57" y="340" font-size="16" fill="white" font-weight="600" text-anchor="middle">3</text><text x="85" y="340" font-size="21" fill="#2563eb" font-weight="650" text-anchor="start">让 Agent 帮忙运行</text><text x="48" y="388" font-size="17" fill="#26364d" font-weight="400" text-anchor="start">先看原来的功能</text><text x="48" y="420" font-size="17" fill="#26364d" font-weight="400" text-anchor="start">再按自己的需要改一点</text><rect x="445" y="304" width="366" height="160" rx="14" fill="#ffffff" stroke="#dce6f5"/><circle cx="474" cy="334" r="17" fill="#c3531b"/><text x="474" y="340" font-size="16" fill="white" font-weight="600" text-anchor="middle">4</text><text x="502" y="340" font-size="21" fill="#2563eb" font-weight="650" text-anchor="start">保存一个可用版本</text><text x="465" y="388" font-size="17" fill="#26364d" font-weight="400" text-anchor="start">Commit：本地存一版</text><text x="465" y="420" font-size="17" fill="#26364d" font-weight="400" text-anchor="start">Push：把版本上传到 GitHub</text><path d="M402 164H433" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M626 251V279H211V294" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M402 385H433" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="28" y="517" font-size="16" fill="#667791" font-weight="400" text-anchor="start">上传代码是保存和分享版本，网页上线是另一件事。</text></g></svg>