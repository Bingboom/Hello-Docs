<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 780" role="img" aria-labelledby="title"><title id="title">找到张三的成绩，从期中70分到期末90分，算出变化为正20分，写入提高20分。其他学生按相同规则写提高、下降或持平。</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L0 6L6 3Z" fill="#2563eb"/></marker></defs><rect width="420" height="780" rx="18" fill="#f7faff"/><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="40" font-size="18" fill="#2563eb" font-weight="650" text-anchor="start">张三的“提高 20 分”怎样得到？</text><rect x="28" y="66" width="364" height="110" rx="14" fill="#ffffff" stroke="#dce6f5"/><text x="46" y="96" font-size="19" fill="#2563eb" font-weight="600" text-anchor="start">① 找到成绩</text><text x="46" y="125" font-size="17" fill="#667791" font-weight="400" text-anchor="start">S001 · 张三 · 数学</text><text x="46" y="152" font-size="17" fill="#667791" font-weight="400" text-anchor="start">期中 70 分 → 期末 90 分</text><path d="M210 185V212" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="28" y="225" width="364" height="118" rx="14" fill="#fff2dc" stroke="#f59e0b"/><text x="46" y="261" font-size="19" fill="#2563eb" font-weight="600" text-anchor="start">② 算出变化</text><text x="46" y="305" font-size="25" fill="#c3531b" font-weight="600" text-anchor="start">90 − 70 = +20 分</text><path d="M210 352V377" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="28" y="392" width="364" height="90" rx="14" fill="#eef8f4" stroke="#dce6f5"/><text x="47" y="429" font-size="19" fill="#2563eb" font-weight="600" text-anchor="start">③ 写入结果</text><text x="47" y="459" font-size="19" fill="#2563eb" font-weight="400" text-anchor="start">张三 · 数学提高 20 分</text><rect x="28" y="507" width="364" height="139" rx="14" fill="#ffffff" stroke="#dce6f5"/><text x="46" y="539" font-size="18" fill="#2563eb" font-weight="600" text-anchor="start">换成其他学生，也按同样的规则</text><text x="46" y="570" font-size="16" fill="#667791" font-weight="400" text-anchor="start">正数 → 写“提高”</text><text x="46" y="595" font-size="16" fill="#667791" font-weight="400" text-anchor="start">负数 → 写“下降”</text><text x="46" y="620" font-size="16" fill="#667791" font-weight="400" text-anchor="start">0 → 写“持平”</text><path d="M210 655V681" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="210" y="712" font-size="19" fill="#2563eb" font-weight="650" text-anchor="middle">④ 接着处理下一个学生</text><text x="210" y="745" font-size="15" fill="#667791" font-weight="400" text-anchor="middle">同样的规则，反复执行</text></g></svg>